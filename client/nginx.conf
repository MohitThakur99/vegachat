server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A little above the 5 MB attachment limit, so the API's own error is what the user sees.
  client_max_body_size 6m;

  # /api and /socket.io responses carry the API's own security headers
  # (helmet). nginx adds none there, or they would arrive twice.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # WebSockets stay open; do not cut them at nginx's default 60 seconds.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Hashed build output never changes under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Client-side routes (/login, /c/<id>) all serve the app shell.
  location / {
    try_files $uri /index.html;

    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Scripts only from this origin and no inline script, so injected markup
    # cannot execute. Images: own files, attachment blobs, and https avatars.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
